!
! HQ-SW1 Configuration - Primary Distribution Switch
! Cisco Catalyst 2960-24TT Switch
! Spanning Tree Primary Root Bridge for all HQ VLANs (Priority 4096)
!
version 12.2
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname HQ-SW1
!
! Spanning Tree PVST+ Configuration (Primary Root Bridge)
spanning-tree mode pvst
spanning-tree extend system-id
spanning-tree vlan 1,10,20,30,40,50,100 priority 4096
!
! 802.1Q Trunk Uplinks to Access Switches
interface FastEthernet0/1
 description Uplink to HQ-Admin-SW (Gi0/1)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/2
 description Uplink to HQ-IT-SW (Gi0/1)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/3
 description Uplink to HQ-Finance-SW (Gi0/1)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/4
 description Uplink to HQ-Guest-SW (Gi0/1)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/5
 description Uplink to HQ-Server-SW (Gi0/1)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/6
 description Uplink to DMZ-SW (Gi0/1)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
! Redundant Distribution Inter-Switch Trunk Links to HQ-SW2
interface FastEthernet0/23
 description Cross-Link to HQ-SW2 (Fa0/23)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/24
 description Cross-Link to HQ-SW2 (Fa0/24)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
! Core Router 802.1Q Trunk Link to HQ-Router
interface GigabitEthernet0/1
 description 802.1Q Router-on-a-Stick Trunk to HQ-Router Gi0/0
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface GigabitEthernet0/2
 switchport mode trunk
!
interface Vlan1
 no ip address
 shutdown
!
line con 0
!
line vty 0 4
 login
line vty 5 15
 login
!
end
