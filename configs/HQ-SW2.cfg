!
! HQ-SW2 Configuration - Secondary Distribution Switch
! Cisco Catalyst 2960-24TT Switch
! Spanning Tree Secondary Root Bridge for all HQ VLANs (Priority 8192)
!
version 12.2
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname HQ-SW2
!
! Spanning Tree PVST+ Configuration (Secondary Root Bridge)
spanning-tree mode pvst
spanning-tree extend system-id
spanning-tree vlan 1,10,20,30,40,50,100 priority 8192
!
! Redundant 802.1Q Trunk Uplinks to Access Switches
interface FastEthernet0/1
 description Redundant Uplink to HQ-Admin-SW (Gi0/2)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/2
 description Redundant Uplink to HQ-IT-SW (Gi0/2)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/3
 description Redundant Uplink to HQ-Finance-SW (Gi0/2)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/4
 description Redundant Uplink to HQ-Guest-SW (Gi0/2)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/5
 description Redundant Uplink to HQ-Server-SW (Gi0/2)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/6
 description Redundant Uplink to DMZ-SW (Gi0/2)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
! Redundant Distribution Inter-Switch Trunk Links to HQ-SW1
interface FastEthernet0/23
 description Cross-Link to HQ-SW1 (Fa0/23)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface FastEthernet0/24
 description Cross-Link to HQ-SW1 (Fa0/24)
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface GigabitEthernet0/1
 switchport mode trunk
!
interface GigabitEthernet0/2
 switchport mode trunk
!
interface Vlan1
 no ip address
 shutdown
!
line con 0
!
line vty 0 4
 login
line vty 5 15
 login
!
end
