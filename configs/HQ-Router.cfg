!
! HQ-Router Configuration - Enterprise Multi-Branch Topology
! Cisco 2911 Integrated Services Router
! Secure Multi-Branch Network Using Site-to-Site IPsec VPN, ACLs, VLANs, and Redundant WAN Failover
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname HQ-Router
!
!
!
!
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.20.1 192.168.20.10
ip dhcp excluded-address 192.168.30.1 192.168.30.10
ip dhcp excluded-address 192.168.40.1 192.168.40.10
ip dhcp excluded-address 192.168.100.1 192.168.100.30
!
ip dhcp pool ADMIN_POOL
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.100.10
ip dhcp pool IT_POOL
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.100.10
ip dhcp pool FINANCE_POOL
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 192.168.100.10
ip dhcp pool GUEST_POOL
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.1
 dns-server 192.168.100.10
!
!
!
ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO2911/K9 sn FTX15248R7X-
license boot module c2900 technology-package securityk9
!
!
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
!
crypto isakmp key ciscoVPN2026 address 198.51.100.2
crypto isakmp key ciscoVPN2026 address 198.51.100.6
crypto isakmp key ciscoVPN2026 address 209.165.202.2
crypto isakmp key ciscoVPN2026 address 209.165.202.6
!
!
!
crypto ipsec transform-set VPN-TS esp-aes esp-sha-hmac
!
crypto map VPN-MAP 10 ipsec-isakmp 
 set peer 198.51.100.2
 set transform-set VPN-TS 
 match address 101
!
crypto map VPN-MAP 20 ipsec-isakmp 
 set peer 198.51.100.6
 set transform-set VPN-TS 
 match address 102
!
!
crypto map VPN-BACKUP 10 ipsec-isakmp 
 set peer 209.165.202.2
 set transform-set VPN-TS 
 match address 101
!
crypto map VPN-BACKUP 20 ipsec-isakmp 
 set peer 209.165.202.6
 set transform-set VPN-TS 
 match address 102
!
!
!
!
!
!
no ip domain-lookup
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/0.10
 description Administration VLAN 10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip helper-address 192.168.100.20
!
interface GigabitEthernet0/0.20
 description IT Department VLAN 20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip helper-address 192.168.100.20
 ip access-group 120 in
!
interface GigabitEthernet0/0.30
 description Finance VLAN 30
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip helper-address 192.168.100.20
 ip access-group 130 in
!
interface GigabitEthernet0/0.40
 description Guest VLAN 40
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 ip helper-address 192.168.100.20
 ip access-group 140 in
!
interface GigabitEthernet0/0.50
 description DMZ Network VLAN 50
 encapsulation dot1Q 50
 ip address 172.16.1.1 255.255.255.0
 ip access-group 150 in
!
interface GigabitEthernet0/0.100
 description Server Farm VLAN 100
 encapsulation dot1Q 100
 ip address 192.168.100.1 255.255.255.0
!
interface GigabitEthernet0/1
 ip address 203.0.113.2 255.255.255.252
 duplex auto
 speed auto
 crypto map VPN-MAP
!
interface GigabitEthernet0/2
 description Backup WAN Link to Backup-ISP
 ip address 209.165.201.2 255.255.255.252
 duplex auto
 speed auto
 crypto map VPN-BACKUP
!
interface Vlan1
 no ip address
!
ip classless
ip route 0.0.0.0 0.0.0.0 203.0.113.1 
ip route 0.0.0.0 0.0.0.0 209.165.201.1 10
ip route 209.165.202.0 255.255.255.0 209.165.201.1 
!
ip flow-export version 9
!
!
access-list 101 permit ip 192.168.10.0 0.0.0.255 192.168.50.0 0.0.0.255
access-list 101 permit ip 192.168.20.0 0.0.0.255 192.168.50.0 0.0.0.255
access-list 101 permit ip 192.168.30.0 0.0.0.255 192.168.50.0 0.0.0.255
access-list 101 permit ip 192.168.100.0 0.0.0.255 192.168.50.0 0.0.0.255
access-list 102 permit ip 192.168.10.0 0.0.0.255 192.168.60.0 0.0.0.255
access-list 102 permit ip 192.168.20.0 0.0.0.255 192.168.60.0 0.0.0.255
access-list 102 permit ip 192.168.30.0 0.0.0.255 192.168.60.0 0.0.0.255
access-list 102 permit ip 192.168.100.0 0.0.0.255 192.168.60.0 0.0.0.255
access-list 120 deny ip 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255
access-list 120 permit ip any any
access-list 130 deny ip 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255
access-list 130 permit ip any any
access-list 140 permit udp 192.168.40.0 0.0.0.255 host 192.168.100.10 eq domain
access-list 140 permit tcp 192.168.40.0 0.0.0.255 host 172.16.1.10 eq www
access-list 140 permit icmp 192.168.40.0 0.0.0.255 host 172.16.1.10
access-list 140 deny ip 192.168.40.0 0.0.0.255 192.168.10.0 0.0.0.255
access-list 140 deny ip 192.168.40.0 0.0.0.255 192.168.20.0 0.0.0.255
access-list 140 deny ip 192.168.40.0 0.0.0.255 192.168.30.0 0.0.0.255
access-list 140 deny ip 192.168.40.0 0.0.0.255 192.168.100.0 0.0.0.255
access-list 140 deny ip 192.168.40.0 0.0.0.255 192.168.50.0 0.0.0.255
access-list 140 deny ip 192.168.40.0 0.0.0.255 192.168.60.0 0.0.0.255
access-list 140 permit ip any any
access-list 150 permit tcp 172.16.1.0 0.0.0.255 any established
access-list 150 permit icmp 172.16.1.0 0.0.0.255 any echo-reply
access-list 150 deny ip 172.16.1.0 0.0.0.255 192.168.10.0 0.0.0.255
access-list 150 deny ip 172.16.1.0 0.0.0.255 192.168.20.0 0.0.0.255
access-list 150 deny ip 172.16.1.0 0.0.0.255 192.168.30.0 0.0.0.255
access-list 150 deny ip 172.16.1.0 0.0.0.255 192.168.40.0 0.0.0.255
access-list 150 deny ip 172.16.1.0 0.0.0.255 192.168.100.0 0.0.0.255
access-list 150 deny ip 172.16.1.0 0.0.0.255 192.168.50.0 0.0.0.255
access-list 150 deny ip 172.16.1.0 0.0.0.255 192.168.60.0 0.0.0.255
access-list 150 permit ip any any
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
