!
! Branch1-Router Configuration - Enterprise Multi-Branch Topology
! Cisco 2911 Integrated Services Router
! Secure Multi-Branch Network Using Site-to-Site IPsec VPN, ACLs, VLANs, and Redundant WAN Failover
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Branch1-Router
!
!
!
!
ip dhcp excluded-address 192.168.50.1 192.168.50.10
!
ip dhcp pool BRANCH1_ROUTER_POOL
 network 192.168.50.0 255.255.255.0
 default-router 192.168.50.1
 dns-server 192.168.100.10
!
!
!
ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO2911/K9 sn FTX1524B1V2-
license boot module c2900 technology-package securityk9
!
!
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
!
crypto isakmp key ciscoVPN2026 address 203.0.113.2
crypto isakmp key ciscoVPN2026 address 209.165.201.2
!
!
!
crypto ipsec transform-set VPN-TS esp-aes esp-sha-hmac
!
crypto map VPN-MAP 10 ipsec-isakmp 
 set peer 203.0.113.2
 set transform-set VPN-TS 
 match address 101
!
!
crypto map VPN-BACKUP 10 ipsec-isakmp 
 set peer 209.165.201.2
 set transform-set VPN-TS 
 match address 101
!
!
!
!
!
!
no ip domain-lookup
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 description Branch 1 LAN Gateway
 ip address 192.168.50.1 255.255.255.0
 ip access-group 110 in
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 198.51.100.2 255.255.255.252
 duplex auto
 speed auto
 crypto map VPN-MAP
!
interface GigabitEthernet0/2
 description Backup WAN Link to Backup-ISP
 ip address 209.165.202.2 255.255.255.252
 duplex auto
 speed auto
 crypto map VPN-BACKUP
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
ip route 0.0.0.0 0.0.0.0 198.51.100.1 
ip route 0.0.0.0 0.0.0.0 209.165.202.1 10
ip route 209.165.201.0 255.255.255.0 209.165.202.1 
!
ip flow-export version 9
!
!
access-list 101 permit ip 192.168.50.0 0.0.0.255 192.168.10.0 0.0.0.255
access-list 101 permit ip 192.168.50.0 0.0.0.255 192.168.20.0 0.0.0.255
access-list 101 permit ip 192.168.50.0 0.0.0.255 192.168.30.0 0.0.0.255
access-list 101 permit ip 192.168.50.0 0.0.0.255 192.168.100.0 0.0.0.255
access-list 110 deny ip host 192.168.50.50 192.168.10.0 0.0.0.255
access-list 110 deny ip host 192.168.50.50 192.168.20.0 0.0.0.255
access-list 110 deny ip host 192.168.50.50 192.168.30.0 0.0.0.255
access-list 110 deny ip host 192.168.50.50 192.168.100.0 0.0.0.255
access-list 110 deny ip host 192.168.50.50 192.168.60.0 0.0.0.255
access-list 110 permit ip host 192.168.50.50 172.16.1.0 0.0.0.255
access-list 110 permit ip any any
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
