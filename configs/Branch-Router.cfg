!
! Branch-Router Configuration - Major Review
! Secure Multi-Branch Network with Site-to-Site IPsec VPN
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Branch-Router
!
ip cef
no ipv6 cef
!
license udi pid CISCO2911/K9 sn FTX1524B1V2-
license boot module c2900 technology-package securityk9
!
crypto isakmp policy 10
 encr aes
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
!
crypto isakmp key ciscoVPN2026 address 203.0.113.2
!
crypto ipsec transform-set VPN-TS esp-aes esp-sha-hmac
 mode tunnel
!
crypto map VPN-MAP 10 ipsec-isakmp 
 set peer 203.0.113.2
 set transform-set VPN-TS 
 match address 101
!
no ip domain-lookup
!
spanning-tree mode pvst
!
interface GigabitEthernet0/0
 description Branch Internal LAN Gateway
 ip address 192.168.20.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description WAN Link to ISP
 ip address 198.51.100.2 255.255.255.252
 duplex auto
 speed auto
 crypto map VPN-MAP
 no shutdown
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
ip route 0.0.0.0 0.0.0.0 198.51.100.1 
!
ip flow-export version 9
!
! Interesting traffic ACL matching Branch LAN to HQ LAN
access-list 101 permit ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255
!
line con 0
line aux 0
line vty 0 4
 login
!
end
