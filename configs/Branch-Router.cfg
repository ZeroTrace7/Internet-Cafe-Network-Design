!
! Branch-Router Configuration - Part 2 (Minor Review)
! Secure Multi-Branch Network with Site-to-Site IPsec VPN & Redundant WAN Failover
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Branch-Router
!
ip cef
no ipv6 cef
!
license udi pid CISCO2911/K9 sn FTX1524B1V2-
license boot module c2900 technology-package securityk9
!
! IKE Phase 1 ISAKMP Policy
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
!
! Pre-shared keys for Primary WAN peer (HQ-Router Gi0/1) and Backup WAN peer (HQ-Router Gi0/2)
crypto isakmp key ciscoVPN2026 address 203.0.113.2
crypto isakmp key ciscoVPN2026 address 209.165.201.2
!
! IPsec Phase 2 Transform Set
crypto ipsec transform-set VPN-TS esp-aes esp-sha-hmac
 mode tunnel
!
! Crypto Map for Primary WAN Interface (Gi0/1)
crypto map VPN-MAP 10 ipsec-isakmp 
 set peer 203.0.113.2
 set transform-set VPN-TS 
 match address 101
!
! Crypto Map for Backup WAN Interface (Gi0/2)
crypto map VPN-BACKUP 10 ipsec-isakmp 
 set peer 209.165.201.2
 set transform-set VPN-TS 
 match address 101
!
no ip domain-lookup
!
spanning-tree mode pvst
!
! Internal Branch LAN Gateway
interface GigabitEthernet0/0
 description Branch Internal LAN Gateway
 ip address 192.168.20.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
! Primary WAN Link to ISP-Router
interface GigabitEthernet0/1
 description WAN Link to ISP
 ip address 198.51.100.2 255.255.255.252
 duplex auto
 speed auto
 crypto map VPN-MAP
 no shutdown
!
! Backup WAN Link to Backup-ISP
interface GigabitEthernet0/2
 description Backup WAN Link to Backup-ISP
 ip address 209.165.202.2 255.255.255.252
 duplex auto
 speed auto
 crypto map VPN-BACKUP
 no shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
!
! Primary Default Route via Primary ISP (Administrative Distance 1)
ip route 0.0.0.0 0.0.0.0 198.51.100.1
!
! Floating Backup Default Route via Backup ISP (Administrative Distance 10)
ip route 0.0.0.0 0.0.0.0 209.165.202.1 10
!
ip flow-export version 9
!
! Interesting Traffic ACL matching Branch LAN to HQ LAN
access-list 101 permit ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255
!
line con 0
line aux 0
line vty 0 4
 login
!
end
