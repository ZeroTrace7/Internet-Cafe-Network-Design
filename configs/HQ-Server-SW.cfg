!
! HQ-Server-SW Configuration - Server Farm Access Switch
! Cisco Catalyst 2960-24TT Switch (VLAN 100)
!
version 12.2
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname HQ-Server-SW
!
spanning-tree mode pvst
spanning-tree extend system-id
!
! Server Farm Ports (VLAN 100)
interface FastEthernet0/1
 description Port to DNS-Server (192.168.100.10)
 switchport access vlan 100
 switchport mode access
!
interface FastEthernet0/2
 description Port to DHCP-Server (192.168.100.20)
 switchport access vlan 100
 switchport mode access
!
interface FastEthernet0/3
 description Port to File-Server (192.168.100.30)
 switchport access vlan 100
 switchport mode access
!
! Redundant 802.1Q Uplinks to Distribution Switches
interface GigabitEthernet0/1
 description Primary Uplink to HQ-SW1 (Fa0/5) - STP Forwarding
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface GigabitEthernet0/2
 description Secondary Uplink to HQ-SW2 (Fa0/5) - STP Alternate Blocking
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface Vlan1
 no ip address
 shutdown
!
line con 0
!
line vty 0 4
 login
line vty 5 15
 login
!
end
