!
! Backup-ISP Configuration - Enterprise Multi-Branch Topology
! Cisco 2911 Integrated Services Router (Secondary WAN Provider)
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Backup-ISP
!
ip cef
no ipv6 cef
!
license udi pid CISCO2911/K9 sn FTX1524ITC1-
!
no ip domain-lookup
!
spanning-tree mode pvst
!
! Backup WAN Link to HQ-Router (Gi0/2)
interface GigabitEthernet0/0
 description Backup Link to HQ-Router
 ip address 209.165.201.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! Backup WAN Link to Branch1-Router (Gi0/2)
interface GigabitEthernet0/1
 description Backup Link to Branch-Router
 ip address 209.165.202.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! Backup WAN Link to Branch2-Router (Gi0/2)
interface GigabitEthernet0/2
 description Backup Transit Link to Branch2-Router
 ip address 209.165.202.5 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
! Static Return Routes to Corporate and DMZ Networks via Backup Customer Gateways
ip route 172.16.1.0 255.255.255.0 209.165.201.2 
ip route 192.168.10.0 255.255.255.0 209.165.201.2 
ip route 192.168.20.0 255.255.255.0 209.165.201.2 
ip route 192.168.30.0 255.255.255.0 209.165.201.2 
ip route 192.168.40.0 255.255.255.0 209.165.201.2 
ip route 192.168.100.0 255.255.255.0 209.165.201.2 
ip route 192.168.50.0 255.255.255.0 209.165.202.2 
ip route 192.168.60.0 255.255.255.0 209.165.202.6 
!
ip flow-export version 9
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
end
