!
! Backup-ISP Configuration - Part 2 (Minor Review)
! Simulated Secondary Transit ISP Router for Redundant Multi-Branch Network
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Backup-ISP
!
ip cef
no ipv6 cef
!
license udi pid CISCO2911/K9 sn FTX1524ITC1-
!
no ip domain-lookup
!
spanning-tree mode pvst
!
interface GigabitEthernet0/0
 description Backup Link to HQ-Router
 ip address 209.165.201.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description Backup Link to Branch-Router
 ip address 209.165.202.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
!
! Static routing to allow transit between office subnets over backup ISP
ip route 192.168.10.0 255.255.255.0 209.165.201.2
ip route 192.168.20.0 255.255.255.0 209.165.202.2
!
ip flow-export version 9
!
line con 0
line aux 0
line vty 0 4
 login
!
end
