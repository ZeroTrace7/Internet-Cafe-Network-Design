!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Edge-Router
!
ip cef
no ipv6 cef
!
license udi pid CISCO2911/K9 sn FTX1524LD05-
!
spanning-tree mode pvst
!
interface GigabitEthernet0/0
 description WAN to ISP Router
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description Trunk to Core Switch
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.10
 description Customer Area Subnet
 encapsulation dot1Q 10
 ip address 192.168.100.1 255.255.255.192
 ip nat inside
!
interface GigabitEthernet0/1.20
 description Gaming Area Subnet
 encapsulation dot1Q 20
 ip address 192.168.100.65 255.255.255.224
 ip nat inside
!
interface GigabitEthernet0/1.30
 description Administration Subnet
 encapsulation dot1Q 30
 ip address 192.168.100.97 255.255.255.240
 ip nat inside
!
interface GigabitEthernet0/1.40
 description Cafe Server Farm Subnet
 encapsulation dot1Q 40
 ip address 192.168.100.113 255.255.255.248
 ip nat inside
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 network 203.0.113.0 0.0.0.3 area 0
 network 192.168.100.0 0.0.0.255 area 0
!
ip nat inside source list 1 interface GigabitEthernet0/0 overload
ip classless
ip route 0.0.0.0 0.0.0.0 203.0.113.1 
!
ip flow-export version 9
!
access-list 1 permit 192.168.100.0 0.0.0.255
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
end
