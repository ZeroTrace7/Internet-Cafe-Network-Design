!
! Branch2-SW Configuration - Branch 2 Access Switch
! Cisco Catalyst 2960-24TT Switch
!
version 12.2
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Branch2-SW
!
spanning-tree mode pvst
spanning-tree extend system-id
!
! Access Ports for Branch 2 Workstations
interface FastEthernet0/1
 description Access Port to Branch2-PC1 (192.168.60.11)
 switchport mode access
!
interface FastEthernet0/2
 description Access Port to Branch2-PC2 (192.168.60.12)
 switchport mode access
!
interface FastEthernet0/3
 description Access Port to Branch2-Guest-PC (192.168.60.50)
 switchport mode access
!
! Uplink to Branch2-Router Gi0/0
interface GigabitEthernet0/1
 description Uplink to Branch2-Router Gi0/0
 switchport mode access
!
interface Vlan1
 no ip address
 shutdown
!
line con 0
!
line vty 0 4
 login
line vty 5 15
 login
!
end
