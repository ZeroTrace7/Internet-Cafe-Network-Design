!
! ISP-Router Configuration - Major Review
! Simulated ISP Transit Router for Multi-Branch Network
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname ISP-Router
!
ip cef
no ipv6 cef
!
license udi pid CISCO2911/K9 sn FTX15244M80-
!
no ip domain-lookup
!
spanning-tree mode pvst
!
interface GigabitEthernet0/0
 description Transit Link to HQ-Router WAN
 ip address 203.0.113.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description Transit Link to Branch-Router WAN
 ip address 198.51.100.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
!
! Static routing to reach office LANs (enables baseline and transit routing)
ip route 192.168.10.0 255.255.255.0 203.0.113.2 
ip route 192.168.20.0 255.255.255.0 198.51.100.2 
!
ip flow-export version 9
!
line con 0
line aux 0
line vty 0 4
 login
!
end
