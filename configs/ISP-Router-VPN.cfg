!
! ISP-Router Configuration - Enterprise Multi-Branch Topology
! Cisco 2911 Integrated Services Router (Primary WAN Provider)
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname ISP-Router
!
ip cef
no ipv6 cef
!
license udi pid CISCO2911/K9 sn FTX15244M80-
!
no ip domain-lookup
!
spanning-tree mode pvst
!
! Primary WAN Link to HQ-Router (Gi0/1)
interface GigabitEthernet0/0
 description Primary WAN Link to HQ-Router
 ip address 203.0.113.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! Primary WAN Link to Branch1-Router (Gi0/1)
interface GigabitEthernet0/1
 description Primary WAN Link to Branch1-Router
 ip address 198.51.100.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! Primary WAN Transit Link to Branch2-Router (Gi0/1)
interface GigabitEthernet0/2
 description Transit Link to Branch2-Router WAN
 ip address 198.51.100.5 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
! Static Return Routes to Corporate and DMZ Networks via Customer Gateways
ip route 172.16.1.0 255.255.255.0 203.0.113.2 
ip route 192.168.10.0 255.255.255.0 203.0.113.2 
ip route 192.168.20.0 255.255.255.0 203.0.113.2 
ip route 192.168.30.0 255.255.255.0 203.0.113.2 
ip route 192.168.40.0 255.255.255.0 203.0.113.2 
ip route 192.168.100.0 255.255.255.0 203.0.113.2 
ip route 192.168.50.0 255.255.255.0 198.51.100.2 
ip route 192.168.60.0 255.255.255.0 198.51.100.6 
!
ip flow-export version 9
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
end
