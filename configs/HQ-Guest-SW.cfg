!
! HQ-Guest-SW Configuration - Guest Department Access Switch
! Cisco Catalyst 2960-24TT Switch (VLAN 40)
!
version 12.2
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname HQ-Guest-SW
!
spanning-tree mode pvst
spanning-tree extend system-id
!
! Department Access Ports for Guest PCs (VLAN 40)
interface FastEthernet0/1
 description Access Port to Guest-PC1 (192.168.40.11)
 switchport access vlan 40
 switchport mode access
!
interface FastEthernet0/2
 description Access Port to Guest-PC2 (192.168.40.12)
 switchport access vlan 40
 switchport mode access
!
! Redundant 802.1Q Uplinks to Distribution Switches
interface GigabitEthernet0/1
 description Primary Uplink to HQ-SW1 (Fa0/4) - STP Forwarding
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface GigabitEthernet0/2
 description Secondary Uplink to HQ-SW2 (Fa0/4) - STP Alternate Blocking
 switchport trunk allowed vlan 10,20,30,40,50,100
 switchport mode trunk
!
interface Vlan1
 no ip address
 shutdown
!
line con 0
!
line vty 0 4
 login
line vty 5 15
 login
!
end
